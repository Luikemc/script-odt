name: Gerar EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Gerar EXE
        run: |
          python -m PyInstaller ^
            --onefile ^
            --windowed ^
            --name SublinharWhatsApp ^
            sublinha.py

      - name: Disponibilizar EXE
        uses: actions/upload-artifact@v4
        with:
          name: SublinharWhatsApp
          path: dist/SublinharWhatsApp.exe

name: Build EXE

# Roda automaticamente quando você enviar (push) mudanças para o
# repositório, e também permite rodar manualmente pela aba "Actions"
# do GitHub (botão "Run workflow").
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tkinterdnd2

      - name: Gerar o .exe
        run: pyinstaller --onefile --noconsole --name "SublinhaCabecalhos" --collect-all tkinterdnd2 sublinha_cabecalhos.py

      - name: Disponibilizar o .exe para download
        uses: actions/upload-artifact@v4
        with:
          name: SublinhaCabecalhos-exe
          path: dist/SublinhaCabecalhos.exe
